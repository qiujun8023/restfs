name: Docker Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and publish image
    # master 和 v* tag 上 CI 通过的 push 才发布；手动触发只允许默认分支和 v* tag
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'master' || startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # workflow_run 的上下文指向默认分支，分支或 tag 名、提交号要从触发它的 CI 运行里取
      - name: Resolve ref
        id: ref
        env:
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          echo "name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.name }},enable=${{ startsWith(steps.ref.outputs.name, 'v') }}
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.name }},enable=${{ startsWith(steps.ref.outputs.name, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.name }},enable=${{ startsWith(steps.ref.outputs.name, 'v') }}
            type=raw,value=${{ steps.ref.outputs.sha_short }}
            type=raw,value=latest,enable=${{ steps.ref.outputs.name == 'master' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
